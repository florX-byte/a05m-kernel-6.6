
on:
  workflow_dispatch:
    inputs:
      root_provider:
        description: "Solución de root"
        type: choice
        options:
          - ksu-next-stable
          - sukisu-ultra-v4.1.3
        default: ksu-next-stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator
          sudo apt-get clean

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libncurses-dev python3 python3-pip zip unzip rsync kmod cpio \
            device-tree-compiler default-jdk git curl patch

      - name: Unduh toolchain dari AOSP (mengganti Google Drive)
        run: |
          set -ex
          # Pin ke commit/tahun yang sama dengan era kernel android15-6.6:
          #  - clang-r510928 (dir clang-r510928 + kleaf/versions.bzl)
          CLANG_SHA="513791fb7edceb387ab12b9d29a9ccbe01cae193"
          #  - bazel 7.4.0 (commit "kleaf: update bazel to 7.4.0")
          BAZEL_SHA="1b27d511686baf431fb8b084d0c421fb5d056125"

          mkdir -p kernel/prebuilts/clang/host/linux-x86 \
                   kernel/prebuilts/build-tools \
                   kernel/prebuilts/kernel-build-tools \
                   kernel/prebuilts/jdk/jdk11 \
                   kernel/prebuilts/ndk-r26

          # 1) Clang r510928 + modul kleaf
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
          git -C clang-repo sparse-checkout init --cone
          git -C clang-repo sparse-checkout set clang-r510928 kleaf
          git -C clang-repo fetch --depth=1 origin "$CLANG_SHA"
          git -C clang-repo checkout FETCH_HEAD
          mv clang-repo/clang-r510928 clang-repo/kleaf kernel/prebuilts/clang/host/linux-x86/

          # 2) Hermetic python (path/linux-x86 + linux-x86)
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/platform/prebuilts/build-tools pbt
          git -C pbt sparse-checkout init --cone
          git -C pbt sparse-checkout set path linux-x86
          git -C pbt checkout HEAD
          mv pbt/path pbt/linux-x86 kernel/prebuilts/build-tools/

          # 3) Binary bazel 7.4.0
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/kernel/prebuilts/build-tools kbt
          git -C kbt sparse-checkout init --cone
          git -C kbt sparse-checkout set bazel
          git -C kbt fetch --depth=1 origin "$BAZEL_SHA"
          git -C kbt checkout FETCH_HEAD
          mv kbt/bazel kernel/prebuilts/kernel-build-tools/

          # 4) JDK 11 (local_jdk)
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/platform/prebuilts/jdk/jdk11 jdk11
          git -C jdk11 sparse-checkout init --cone
          git -C jdk11 sparse-checkout set linux-x86
          git -C jdk11 checkout HEAD
          mv jdk11/linux-x86 kernel/prebuilts/jdk/jdk11/

          # 5) Sysroot NDK r26
          git clone --filter=blob:none --no-checkout \
            https://android.googlesource.com/toolchain/prebuilts/ndk/r26 ndkr26
          git -C ndkr26 sparse-checkout init --cone
          git -C ndkr26 sparse-checkout set toolchains/llvm/prebuilt/linux-x86_64/sysroot
          git -C ndkr26 checkout HEAD
          mv ndkr26/toolchains kernel/prebuilts/ndk-r26/

          # 6) file BUILD bawaan untuk prebuilts/build-tools (target py_toolchain)
          git clone --depth 1 --filter=blob:none -n \
            https://android.googlesource.com/platform/prebuilts/build-tools pbt-build
          git -C pbt-build sparse-checkout init --cone
          git -C pbt-build sparse-checkout set /BUILD.bazel /prebuilt_tool.bzl
          git -C pbt-build checkout HEAD
          mv pbt-build/BUILD.bazel pbt-build/prebuilt_tool.bzl kernel/prebuilts/build-tools/

          # 7) external/* di root repo (symlink kernel/external/* menunjuk ke sini)
          mkdir -p external/python
          for repo in bazel-skylib bazelbuild-rules_cc bazelbuild-rules_license \
                      bazelbuild-rules_pkg bazelbuild-rules_python bazelbuild-rules_rust \
                      libcap libcap-ng stardoc zopfli pigz; do
            git clone --depth 1 --filter=blob:none \
              "https://android.googlesource.com/platform/external/$repo" "external/$repo"
          done
          git clone --depth 1 --filter=blob:none \
            https://android.googlesource.com/platform/external/python/absl-py external/python/absl-py

          ls external | head -20

      - name: Integrar KernelSU-Next
        if: ${{ inputs.root_provider == 'ksu-next-stable' }}
        working-directory: ./kernel-6.6
        run: |
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          test -d KernelSU-Next
          sed -i 's/static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/' KernelSU-Next/kernel/feature/selinux_hide.c
          sed -i 's/static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/' KernelSU-Next/kernel/feature/selinux_hide.c
          sed -i 's/static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/' KernelSU-Next/kernel/feature/selinux_hide.c
          echo "KSUN_COMMIT=$(cd KernelSU-Next && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=KSUN" >> "$GITHUB_ENV"

      - name: Integrar SukiSU-Ultra
        if: ${{ inputs.root_provider == 'sukisu-ultra-v4.1.3' }}
        working-directory: ./kernel-6.6
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin
          test -d KernelSU/kernel
          echo "SUKISU_COMMIT=$(cd KernelSU && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_NAME=SKSU" >> "$GITHUB_ENV"

      - name: Integrar parches SUSFS al código del Kernel
        working-directory: ./kernel-6.6
        run: |
          git clone -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c ./fs/susfs.c
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs.h ./include/linux/susfs.h
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h ./include/linux/susfs_def.h
          sed -i '1i #include <linux/sched.h>\n#include <linux/thread_info.h>\n#include <linux/cred.h>' include/linux/susfs_def.h
          sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/open.c
          sed -i '/copy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;/,/#endif/ {
            /#ifdef CONFIG_KDP_NS/,/#endif/ {
               /#else/,/#endif/!d
               /#else/d
               /#endif/d
            }
          }' fs/namespace.c
          patch -p1 --forward --fuzz=3 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch || true
          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          fi
          if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
            sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
          fi
          grep -q "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" fs/Makefile
          grep -q "ksu_handle_execveat(&fd" fs/exec.c
          grep -q "ksu_handle_faccessat(&dfd" fs/open.c
          grep -q "ksu_handle_sys_reboot(magic1" kernel/reboot.c
          grep -q "ksu_handle_sys_read(fd);" fs/read_write.c
          grep -q "ksu_handle_vfs_fstat(fd" fs/stat.c
          grep -q "ksu_handle_stat(&dfd" fs/stat.c
          grep -q "susfs_is_inode_sus_path" fs/namei.c
          grep -q "#define SUSFS_VERSION" include/linux/susfs.h
          find . -name "*.rej" -print

      - name: Fijar restricciones del compilador Clang
        working-directory: ./kernel-6.6
        run: |
          sed -i '1i #pragma GCC diagnostic ignored "-Warray-bounds"' include/linux/signal.h
          for selinux_file in "KernelSU/kernel/feature/selinux_hide.c" "KernelSU-Next/kernel/feature/selinux_hide.c"; do
            if [ -f "$selinux_file" ]; then
              sed -i '1i #pragma GCC diagnostic ignored "-Wpointer-bool-conversion"' "$selinux_file"
            fi
          done

      - name: Habilitar CONFIG_KSU y SUSFS en overlay
        run: |
          CFG=$(grep -rl "CONFIG_KSU" --include="*.config" . 2>/dev/null | head -n1)
          if [ -z "$CFG" ]; then
            CFG="./kernel/kernel_device_modules-6.6/kernel/configs/mt6768_overlay.config"
          fi
          if ! grep -q "CONFIG_KSU=y" "$CFG"; then
            echo "CONFIG_KSU=y" >> "$CFG"
          fi
          sed -i '/CONFIG_KSU_SUSFS/d' "$CFG"
          cat <<EOF >> "$CFG"
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          # Disable Samsung Knox/DEFEX in mediatek-bazel_defconfig
          DEFEX_CFG="./kernel/kernel_device_modules-6.6/arch/arm64/configs/mediatek-bazel_defconfig"
          if [ -f "$DEFEX_CFG" ]; then
            sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/' "$DEFEX_CFG"
            sed -i 's/CONFIG_SECURITY_DEFEX_USER=y/# CONFIG_SECURITY_DEFEX_USER is not set/' "$DEFEX_CFG"
          fi

      - name: Cache de Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-cache-${{ runner.os }}-${{ inputs.root_provider }}-${{ hashFiles('kernel/WORKSPACE') }}

      - name: Compilar
        run: |
          chmod +x build_kernel.sh
          bash build_kernel.sh

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a05m-kernel-${{ inputs.root_provider }}-${{ github.run_number }}
          path: "*.zip"
          retention-days: 14
